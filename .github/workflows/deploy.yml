name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/xuny-appv2' }}
          PM2_NAME: ${{ secrets.PM2_NAME || 'xuny-appv2-api' }}
          API_PORT: ${{ secrets.API_PORT || '5000' }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "REPO_URL='$REPO_URL' DEPLOY_PATH='$DEPLOY_PATH' PM2_NAME='$PM2_NAME' API_PORT='$API_PORT' bash -s" << 'EOF'
            set -euo pipefail

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$DEPLOY_PATH"
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard origin/main

            npm ci
            npm run build

            (cd server && npm ci)

            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
                pm2 restart "$PM2_NAME"
              else
                PORT="$API_PORT" pm2 start server/index.js --name "$PM2_NAME" --time
              fi
              pm2 save
            elif command -v systemctl >/dev/null 2>&1 && systemctl list-units --type=service --all | grep -q "$PM2_NAME"; then
              systemctl restart "$PM2_NAME"
            else
              echo "Deploy feito (pull/build). Reinício do servidor não configurado (pm2/systemd)."
              exit 1
            fi
          EOF
