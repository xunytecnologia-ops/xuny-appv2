name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          PM2_NAME: ${{ secrets.PM2_NAME || 'xuny-appv2-api' }}
          API_PORT: ${{ secrets.API_PORT || '5000' }}
        run: |
          bash ./deploy.sh
